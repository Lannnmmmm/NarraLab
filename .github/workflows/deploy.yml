name: Deploy NarraLab ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "novel/**"
      - "canon/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm install

      # Belum memblokir deploy; jadikan ketat setelah lolos bersih sekali.
      - name: Periksa tipe
        run: npm run typecheck
        continue-on-error: true

      - name: Bangun indeks dan situs
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
